<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>AI Football Live</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#09101d;overflow:hidden}iframe{display:block;width:100vw;height:100dvh;border:0;background:#09101d}
</style>
</head>
<body>
<iframe id="gameFrame" src="./live.html?v=18" allow="autoplay"></iframe>
<script>
const frame=document.getElementById('gameFrame');
function inject(doc,id,src){if(doc.getElementById(id))return;const s=doc.createElement('script');s.id=id;s.src=src;doc.body.appendChild(s)}
function attachHelpers(){try{const doc=frame.contentDocument;if(!doc||!doc.body)return;inject(doc,'adminPowerFix','./admin-power-fix.js?v=6');inject(doc,'stadiumAudioScript','./stadium-audio-clean.js?v=2');inject(doc,'instantSyncFix','./instant-sync.js?v=2')}catch(e){console.error('Yardımcı dosyalar yüklenemedi',e)}}
frame.addEventListener('load',attachHelpers);
</script>
</body>
</html>
