<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>AI Football Live</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#09101d;overflow:hidden}iframe{display:block;width:100vw;height:100dvh;border:0;background:#09101d}
</style>
</head>
<body>
<iframe id="gameFrame" allow="autoplay"></iframe>
<script>
const frame=document.getElementById('gameFrame');
const fresh=()=>Date.now().toString(36);
function inject(doc,id,path){if(doc.getElementById(id))return;const s=doc.createElement('script');s.id=id;s.src=path+(path.includes('?')?'&':'?')+'cb='+fresh();doc.body.appendChild(s)}
function attachHelpers(){try{const doc=frame.contentDocument;if(!doc||!doc.body)return;inject(doc,'adminPowerFix','./admin-power-fix.js');inject(doc,'stadiumAudioScript','./stadium-audio-clean.js');inject(doc,'gameplayUiFix','./gameplay-ui-fix.js');inject(doc,'game3dScript','./game-3d.js');inject(doc,'instantSyncFix','./instant-sync.js')}catch(e){console.error('Yardımcı dosyalar yüklenemedi',e)}}
frame.addEventListener('load',attachHelpers);
frame.src='./live.html?cb='+fresh();
</script>
</body>
</html>
