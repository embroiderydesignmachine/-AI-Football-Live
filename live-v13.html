<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AI Football Live</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#09101d;overflow:hidden}iframe{display:block;width:100vw;height:100dvh;border:0;background:#09101d}
</style>
</head>
<body>
<iframe id="gameFrame" src="./live.html?v=12" allow="autoplay"></iframe>
<script>
const frame=document.getElementById('gameFrame');
function attachAudio(){
  try{
    const doc=frame.contentDocument;
    if(!doc||!doc.body)return;
    if(doc.getElementById('stadiumAudioScript'))return;
    const s=doc.createElement('script');
    s.id='stadiumAudioScript';
    s.src='./stadium-audio.js?v=2';
    doc.body.appendChild(s);
  }catch(e){console.error('Stadyum sesi yüklenemedi',e)}
}
frame.addEventListener('load',attachAudio);
</script>
</body>
</html>
