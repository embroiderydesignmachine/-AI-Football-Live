<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AI Football Live</title>
<style>
:root{--bg:#0b1020;--card:#151c31;--line:#2b3556;--text:#f7f8fc;--muted:#aab2c8;--blue:#2f63ff;--purple:#7b4df6}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#09101d,#11192b);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{overflow-x:hidden}.wrap{max-width:760px;margin:auto;padding:6px 8px 10px;min-height:100dvh}
.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:5px}.title{font-size:18px;font-weight:900;line-height:1}.sub{font-size:8px;color:var(--muted);text-align:right;max-width:180px;line-height:1.15}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px 8px;margin-bottom:5px;height:60px}.scoreTeam{display:flex;align-items:center;justify-content:center;gap:8px}.num{font-size:31px;font-weight:900;line-height:1}.vs{color:var(--muted);font-weight:900;font-size:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;margin:5px 0}.panelHead{display:flex;align-items:center;gap:7px;height:28px}.panelHead span:last-child{font-size:10px;color:var(--muted);font-weight:800}
.sectionLabel{font-size:8px;color:var(--muted);font-weight:900;margin:4px 0 3px;letter-spacing:.2px}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.giftbtn{border:0;border-radius:9px;padding:3px 1px 4px;color:#fff;font-weight:800;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;overflow:hidden}.giftbtn:active{transform:scale(.98)}.shot{background:linear-gradient(180deg,#315fff,#2448c7)}.def{background:linear-gradient(180deg,#8458ff,#643ac8)}
.giftIcon{width:22px;height:22px;object-fit:contain;display:block}.giftFallback{width:22px;height:22px;display:none;align-items:center;justify-content:center;font-size:18px;line-height:1}.giftName{font-size:6.7px;line-height:1;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}.giftEffect{font-size:8px;line-height:1}.coin{font-size:6.8px;color:#ffe78b;line-height:1}.comboBadge{position:absolute;top:2px;right:3px;background:#0b1020;border-radius:999px;padding:1px 3px;font-size:6px}
.status{height:27px;margin-top:5px;background:#0d1425;border:1px solid var(--line);border-radius:9px;padding:5px 7px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center}.note{text-align:center;color:var(--muted);font-size:7.5px;line-height:1.15;margin-top:4px}
.jersey{width:45px;height:29px;position:relative;display:inline-block;clip-path:polygon(18% 0,37% 8%,63% 8%,82% 0,100% 22%,86% 40%,78% 30%,78% 90%,22% 90%,22% 30%,14% 40%,0 22%);border-radius:4px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}.jA{background:repeating-linear-gradient(90deg,#ffd21f 0 9px,#173f9b 9px 18px)}.jB{background:repeating-linear-gradient(90deg,#ffd21f 0 9px,#c91f2c 9px 18px)}.miniJersey{width:38px;height:25px}
@media(max-height:650px){.giftbtn{min-height:50px}.giftIcon,.giftFallback{width:19px;height:19px}.panel{padding:5px}.score{height:54px}.status{height:24px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div class="title">AI Football Live</div><div class="sub">TikTok hediye test ekranı</div></div>

  <div class="score">
    <div class="scoreTeam"><span class="jersey miniJersey jA"></span><div class="num" id="scoreA">0</div></div>
    <div class="vs">VS</div>
    <div class="scoreTeam"><span class="jersey miniJersey jB"></span><div class="num" id="scoreB">0</div></div>
  </div>

  <section class="panel">
    <div class="panelHead"><span class="jersey jA"></span><span>SARI-LACİVERT</span></div>
    <div class="sectionLabel">ŞUT HEDİYELERİ</div>
    <div class="buttons">
      <button class="giftbtn shot" onclick="addShots('A',1)"><img class="giftIcon" src="https://p16-webcast.tiktokcdn.com/img/alisg/webcast-sg/resource/85e79c76fd9b5ded418565427a67f424.png~tplv-obj.webp" onerror="giftFail(this)"><span class="giftFallback">⚽</span><span class="giftName">League Ball</span><span class="giftEffect">1 şut</span><span class="coin">10 jeton</span></button>
      <button class="giftbtn shot" onclick="addShots('A',5)"><img class="giftIcon" src="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/c84fe43f3177684b07ad2f13138a852d~tplv-obj.webp" onerror="giftFail(this)"><span class="giftFallback">🍵</span><span class="giftName">Tea</span><span class="giftEffect">5 şut</span><span class="coin">50 jeton</span></button>
      <button class="giftbtn shot" onclick="addShots('A',10)"><img class="giftIcon" src="https://p16-webcast.tiktokcdn.com/img/alisg/webcast-sg/resource/374dfe46d5b09ce1db19be06202d34f5.png~tplv-obj.webp" onerror="giftFail(this)"><span class="giftFallback">🫶</span><span class="giftName">Hand Heart</span><span class="giftEffect">10 şut</span><span class="coin">100 jeton</span></button>
      <button class="giftbtn shot" onclick="addShots('A',50)"><img class="giftIcon" src="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/e0589e95a2b41970f0f30f6202f5fce6~tplv-obj.webp" onerror="giftFail(this)"><span class="giftFallback">💸</span><span class="giftName">Money Gun</span><span class="giftEffect">50 şut</span><span class="coin">500 jeton</span></button>
    </div>
    <div class="sectionLabel">KALECİ SAVUNMA HEDİYELERİ</div>
    <div class="buttons">
      <button class="giftbtn def" onclick="addKeeper('A',1)"><img class="giftIcon" src="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/resource/e033c3f28632e233bebac1668ff66a2f.png~tplv-obj.webp" onerror="giftFail(this)"><span class="giftFallback">📿</span><span class="giftName">Friendship Necklace</span><span class="giftEffect">1 savunma</span><span class="coin">10 jeton</span></button>
      <button class="giftbtn def" onclick="addKeeper('A',5)"><span class="comboBadge">×5</span><img class="giftIcon" src="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/resource/e033c3f28632e233bebac1668ff66a2f.png~tplv-obj.webp" onerror="giftFail(this)"><span class="giftFallback">📿</span><span class="giftName">Necklace ×5</span><span class="giftEffect">5 savunma</span><span class="coin">50 jeton</span></button>
      <button class="giftbtn def" onclick="addKeeper('A',10)"><img class="giftIcon" src="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/20ec0eb50d82c2c445cb8391fd9fe6e2~tplv-obj.webp" onerror="giftFail(this)"><span class="giftFallback">🎮</span><span class="giftName">Game Controller</span><span class="giftEffect">10 savunma</span><span class="coin">100 jeton</span></button>
      <button class="giftbtn def" onclick="addKeeper('A',50)"><img class="giftIcon" src="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/dd06007ade737f1001977590b11d3f61~tplv-obj.webp" onerror="giftFail(this)"><span class="giftFallback">💎</span><span class="giftName">Gem Gun</span><span class="giftEffect">50 savunma</span><span class="coin">500 jeton</span></button>
    </div>
  </section>

  <section class="panel">
    <div class="panelHead"><span class="jersey jB"></span><span>SARI-KIRMIZI</span></div>
    <div class="sectionLabel">ŞUT HEDİYELERİ</div>
    <div class="buttons">
      <button class="giftbtn shot" onclick="addShots('B',1)"><img class="giftIcon" src="https://p16-webcast.tiktokcdn.com/img/alisg/webcast-sg/resource/85e79c76fd9b5ded418565427a67f424.png~tplv-obj.webp" onerror="giftFail(this)"><span class="giftFallback">⚽</span><span class="giftName">League Ball</span><span class="giftEffect">1 şut</span><span class="coin">10 jeton</span></button>
      <button class="giftbtn shot" onclick="addShots('B',5)"><img class="giftIcon" src="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/c84fe43f3177684b07ad2f13138a852d~tplv-obj.webp" onerror="giftFail(this)"><span class="giftFallback">🍵</span><span class="giftName">Tea</span><span class="giftEffect">5 şut</span><span class="coin">50 jeton</span></button>
      <button class="giftbtn shot" onclick="addShots('B',10)"><img class="giftIcon" src="https://p16-webcast.tiktokcdn.com/img/alisg/webcast-sg/resource/374dfe46d5b09ce1db19be06202d34f5.png~tplv-obj.webp" onerror="giftFail(this)"><span class="giftFallback">🫶</span><span class="giftName">Hand Heart</span><span class="giftEffect">10 şut</span><span class="coin">100 jeton</span></button>
      <button class="giftbtn shot" onclick="addShots('B',50)"><img class="giftIcon" src="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/e0589e95a2b41970f0f30f6202f5fce6~tplv-obj.webp" onerror="giftFail(this)"><span class="giftFallback">💸</span><span class="giftName">Money Gun</span><span class="giftEffect">50 şut</span><span class="coin">500 jeton</span></button>
    </div>
    <div class="sectionLabel">KALECİ SAVUNMA HEDİYELERİ</div>
    <div class="buttons">
      <button class="giftbtn def" onclick="addKeeper('B',1)"><img class="giftIcon" src="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/resource/e033c3f28632e233bebac1668ff66a2f.png~tplv-obj.webp" onerror="giftFail(this)"><span class="giftFallback">📿</span><span class="giftName">Friendship Necklace</span><span class="giftEffect">1 savunma</span><span class="coin">10 jeton</span></button>
      <button class="giftbtn def" onclick="addKeeper('B',5)"><span class="comboBadge">×5</span><img class="giftIcon" src="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/resource/e033c3f28632e233bebac1668ff66a2f.png~tplv-obj.webp" onerror="giftFail(this)"><span class="giftFallback">📿</span><span class="giftName">Necklace ×5</span><span class="giftEffect">5 savunma</span><span class="coin">50 jeton</span></button>
      <button class="giftbtn def" onclick="addKeeper('B',10)"><img class="giftIcon" src="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/20ec0eb50d82c2c445cb8391fd9fe6e2~tplv-obj.webp" onerror="giftFail(this)"><span class="giftFallback">🎮</span><span class="giftName">Game Controller</span><span class="giftEffect">10 savunma</span><span class="coin">100 jeton</span></button>
      <button class="giftbtn def" onclick="addKeeper('B',50)"><img class="giftIcon" src="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/dd06007ade737f1001977590b11d3f61~tplv-obj.webp" onerror="giftFail(this)"><span class="giftFallback">💎</span><span class="giftName">Gem Gun</span><span class="giftEffect">50 savunma</span><span class="coin">500 jeton</span></button>
    </div>
  </section>

  <div class="status" id="event">Hazır</div>
  <div class="note">Sonuçlar tanımlı oyun kurallarına göre belirlenir; rastgele değildir.</div>
</div>
<script>
const state={shotThreshold:10,startKeeper:100,keeperCost:10,shotDelay:3000,A:{credit:0,score:0},B:{credit:0,score:0},keeper:{A:100,B:100},busy:false,lastTeam:'B'};
const $=id=>document.getElementById(id);const nameOf=t=>t==='A'?'Sarı-Lacivert':'Sarı-Kırmızı';
function giftFail(img){img.style.display='none';const f=img.nextElementSibling;if(f&&f.classList.contains('giftFallback'))f.style.display='flex'}
function readyShots(t){return Math.floor(state[t].credit/state.shotThreshold)}
function render(){$('scoreA').textContent=state.A.score;$('scoreB').textContent=state.B.score}
function log(msg){$('event').textContent=msg}
function addShots(t,n){state[t].credit+=n*state.shotThreshold;log(nameOf(t)+' için '+n+' şut eklendi');render();processQueue()}
function addKeeper(t,n){state.keeper[t]+=n;log('Kaleci savunması güçlendirildi');render()}
function chooseTeam(){const a=readyShots('A')>0,b=readyShots('B')>0;if(a&&b)return state.lastTeam==='A'?'B':'A';if(a)return'A';if(b)return'B';return null}
async function processQueue(){if(state.busy)return;state.busy=true;while(true){const t=chooseTeam();if(!t)break;state[t].credit-=state.shotThreshold;state.lastTeam=t;render();await resolveShot(t);await new Promise(r=>setTimeout(r,state.shotDelay))}state.busy=false}
async function resolveShot(t){const before=state.keeper[t];log('⚽ '+nameOf(t)+' şut çekiyor!');await new Promise(r=>setTimeout(r,700));if(before<=0){state[t].score++;state.keeper[t]=state.startKeeper;log('🥅 GOL! '+nameOf(t))}else{state.keeper[t]=Math.max(0,before-state.keeperCost);log('🧤 Kaleci kurtardı!')}render()}
render();
</script>
</body>
</html>
